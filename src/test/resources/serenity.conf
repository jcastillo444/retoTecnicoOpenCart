serenity {
  project.name = "OpenCart - Compra como invitado"
  take.screenshots = AFTER_EACH_STEP
  logging = VERBOSE
}

headless.mode = false

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "incognito", "window-size=1920,1080", "disable-dev-shm-usage",
        "no-sandbox", "disable-gpu", "disable-extensions", "disable-popup-blocking"]
    }
  }
}

environments {
  default {
    headless.mode = false
  }
  headless {
    headless.mode = true
  }
}
